services:
  - type: web
    name: innoadmin
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback
    envVars:
      - key: VITE_API_URL
        value: https://innowebsrv.onrender.com   # update to your InnoWebSrv URL after deploy
